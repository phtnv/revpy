# Local server
HOST=127.0.0.1
PORT=5001

# Key you generate in Claude Console.
ANTHROPIC_API_KEY=your_anthropic_api_key
# The key that you actually put into JanitorAI. Can be anything.
PROXY_KEY=key_you_write_in_janitor
REQUIRE_PROXY_KEY=true
# Allow key from Janitor to be used for Claude.
ALLOW_KEY_PASSTHROUGH=false

# Default Claude model. Available model list is requested at start from Anthropic. Use 'm' in CLI to check it.
MODEL=claude-sonnet-4-6

# Generation parameters. The values below are the default values if not set directly.
# MAX_TOKENS, unlike other parameters, is overridden from Janitor.
MAX_TOKENS=128000
# Incompatible with thinking.
SEND_TEMPERATUR=false
TEMPERATURE=1
# Allowed range is 0.95 - 1 for thinking.
SEND_TOP_P=false
TOP_P=0.99
# Unsupported for modern Claude models. Actual default values is unknown.
SEND_TOP_K=false
TOP_K=75

# Cost tracking. Prices in USD per 1 million tokens.
FABLE_INPUT_TOKEN_COST_USD=10.00
FABLE_OUTPUT_TOKEN_COST_USD=50.00
FABLE_CACHE_WRITE_5M_COST_USD=12.50
FABLE_CACHE_WRITE_1H_COST_USD=20.00
FABLE_CACHE_READ_COST_USD=1.00
OPUS_INPUT_TOKEN_COST_USD=5.00
OPUS_OUTPUT_TOKEN_COST_USD=25.00
OPUS_CACHE_WRITE_5M_COST_USD=6.25
OPUS_CACHE_WRITE_1H_COST_USD=10.00
OPUS_CACHE_READ_COST_USD=0.50
SONNET_INPUT_TOKEN_COST_USD=3.00
SONNET_OUTPUT_TOKEN_COST_USD=15.00
SONNET_CACHE_WRITE_5M_COST_USD=3.75
SONNET_CACHE_WRITE_1H_COST_USD=6.00
SONNET_CACHE_READ_COST_USD=0.30
HAIKU_INPUT_TOKEN_COST_USD=1.00
HAIKU_OUTPUT_TOKEN_COST_USD=5.00
HAIKU_CACHE_WRITE_5M_COST_USD=1.25
HAIKU_CACHE_WRITE_1H_COST_USD=2.00
HAIKU_CACHE_READ_COST_USD=0.10

# Caching
# Enable / Disable all caching.
CACHE_EN=true
# Cache system message.
CACHE_SYSTEM=true
CACHE_SYSTEM_TTL=1h
# Split system message into core definitions + lorebook, with an individual cache marker on each.
# See `split_system_prompt_into_text_blocks` in `server.py` for more info.
SPLIT_LOREBOOK=true
LOREBOOK_AT_END=false
LOREBOOK_XML_AT_END=false
# Manual cache marker placed CACHE_MANUAL_MSG from the start.
# 1 - first message of the chat (the intro). 0 to disable.
# Note that because LLMs expect user+assistant message pairs starting from user, chat agents (like Janitor) often send
# a fake user message at start (Janitor sends '.' as the first user message). This fake message is not counted.
CACHE_MANUAL_MSG=1
CACHE_MANUAL_TTL=1h
# Auto cache marker placed from CACHE_AUTO_MSG from the end.
# 1 - last user message. 0 to disable.
CACHE_AUTO_MSG=3
CACHE_AUTO_TTL=1h
# Anthropic auto-caching. Automatically caches the last message.
CACHE_ANTHROPIC_AUTO=false
CACHE_ANTHROPIC_TTL=1h

# Prefill
# none        - Disable prefill.
# assistant   - Append prefill as the last assistant message. Not compatible with thinking and Mythos (>=4.6) models.
# instruction - Append prefill as an OOC command at the end of last user message.
PREFILL_MODE=none
ASSISTANT_PREFILL=""

# Behavior
AUTO_TRIM=true
# Enables replacing <summary_block_beg>/<summary_block_end> ranges with the summary text.
# When false, summary control messages are stripped but original conversation messages are kept.
SUMMARY_BLOCKS_ENABLED=true
DEBUG_LOG=true
ERROR_LOG_PATH=revpy_error.log

# Thinking
THINKING_ENABLED=true
# Budget is used for older (<=4.5) models. Modern ones prefer (or support only) effort.
THINKING_BUDGET=2048
# low, medium, high, xhigh, max
THINKING_EFFORT=high
PRESERVE_THINKING_BLOCKS=0

# OpenAI-style providers (GLM, Aion, Kimi, ...).
# Comma-separated provider names; each NAME is configured through NAME_* variables.
# Their models appear in the CLI 'model' list after the Anthropic ones; selecting one switches the active backend.
# Claude-only features (explicit cache markers, signed thinking-block preservation, assistant prefill) do not apply to them.
# The shared thinking settings are passed through in the provider dialect for Aion, GLM and Kimi models; other providers configure thinking through EXTRA_BODY.
#OPENAI_PROVIDERS=aion,glm,kimi
#OPENAI_REQUEST_TIMEOUT_SECONDS=600

# Aion
# Aion thinking passthrough is built in and model-dependent:
#   aion-2.0       on by default; depth via reasoning_effort (none|low|medium|high, default medium).
#                  The proxy maps its five efforts onto that scale (xhigh/max->high) and
#                  sends 'none' to disable thinking.
#   aion-2.5/3.0/3.0-mini
#                  always on; no controls at all. These models reject reasoning_effort
#                  with HTTP 400, so do not put it in EXTRA_BODY.
#   aion-rp-*      does not reason.
# Aion splits the thoughts into a separate `reasoning` field by default (reasoning_split),
# which is what the proxy reads; leave it alone unless you know why you're changing it.
#AION_BASE_URL=https://api.aionlabs.ai/v1
#AION_API_KEY=your_aion_api_key
#AION_EXTRA_BODY={}
#AION_MODEL_AION20_REGEX=aion-2\.0$
#AION_MODEL_AION20_COST={input: 0.80, output: 1.60, cache_read: 0.20}
#AION_MODEL_AION25_REGEX=aion-2\.5$
#AION_MODEL_AION25_COST={input: 1.00, output: 3.00, cache_read: 0.35}
#AION_MODEL_AION30_REGEX=aion-3\.0$
#AION_MODEL_AION30_COST={input: 3.00, output: 6.00, cache_read: 0.75}
#AION_MODEL_AION30MINI_REGEX=aion-3\.0-mini$
#AION_MODEL_AION30MINI_COST={input: 0.70, output: 1.40, cache_read: 0.18}
#AION_MODEL_AIONRP_REGEX=aion-rp-
#AION_MODEL_AIONRP_COST={input: 0.80, output: 1.60}

# GLM
#GLM_BASE_URL=https://api.z.ai/api/paas/v4
#GLM_API_KEY=your_glm_api_key
#GLM_INPUT_TOKEN_COST_USD=0.60
#GLM_OUTPUT_TOKEN_COST_USD=2.20
#GLM_CACHE_READ_COST_USD=0.11
# The GLM values below are from https://docs.z.ai/guides/overview/pricing (July 2026).
#GLM_MODEL_GLM45AIR_REGEX=glm-4\.5-air$
#GLM_MODEL_GLM45AIR_COST={input: 0.20, output: 1.10, cache_read: 0.03}
#GLM_MODEL_GLM45_REGEX=glm-4\.5$
#GLM_MODEL_GLM45_COST={input: 0.60, output: 2.20, cache_read: 0.11}
#GLM_MODEL_GLM46_REGEX=glm-4\.6$
#GLM_MODEL_GLM46_COST={input: 0.60, output: 2.20, cache_read: 0.11}
#GLM_MODEL_GLM47_REGEX=glm-4\.7$
#GLM_MODEL_GLM47_COST={input: 0.60, output: 2.20, cache_read: 0.11}
#GLM_MODEL_GLM5_REGEX=glm-5$
#GLM_MODEL_GLM5_COST={input: 1.00, output: 3.20, cache_read: 0.20}
#GLM_MODEL_GLM5TURBO_REGEX=glm-5-turbo$
#GLM_MODEL_GLM5TURBO_COST={input: 1.20, output: 4.00, cache_read: 0.24}
#GLM_MODEL_GLM51_REGEX=glm-5\.1$
#GLM_MODEL_GLM51_COST={input: 1.40, output: 4.40, cache_read: 0.26}
#GLM_MODEL_GLM52_REGEX=glm-5\.2$
#GLM_MODEL_GLM52_COST={input: 1.40, output: 4.40, cache_read: 0.26}

# Kimi
# Kimi thinking passthrough is built in and model-dependent:
#   kimi-k3        always on; effort via reasoning_effort (low|high|max, default max).
#                  The proxy maps its five efforts onto that scale: medium->low, xhigh->max.
#   kimi-k2.7-code always on; no effort control.
#   kimi-k2.5/2.6  on by default; on/off switch only, no effort control.
# Kimi context caching is fully automatic (no markers, no TTLs); cache hits are billed
# at the cache_read rate and show up as cached prompt tokens in usage.
# Kimi thinking models reject a custom temperature and recommend max_tokens >= 16000.
#KIMI_BASE_URL=https://api.moonshot.ai/v1
#KIMI_API_KEY=your_kimi_api_key
#KIMI_EXTRA_BODY={}
#KIMI_INPUT_TOKEN_COST_USD=3.00
#KIMI_OUTPUT_TOKEN_COST_USD=15.00
#KIMI_CACHE_READ_COST_USD=0.30
# The Kimi values below are from https://platform.kimi.ai/docs/pricing/chat (July 2026).
#KIMI_MODEL_K3_REGEX=^kimi-k3
#KIMI_MODEL_K3_COST={input: 3.00, output: 15.00, cache_read: 0.30}
#KIMI_MODEL_K27CODE_REGEX=^kimi-k2\.7-code
#KIMI_MODEL_K27CODE_COST={input: 0.95, output: 4.00, cache_read: 0.19}
#KIMI_MODEL_K26_REGEX=^kimi-k2\.6
#KIMI_MODEL_K26_COST={input: 0.95, output: 4.00, cache_read: 0.16}
