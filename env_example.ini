# Local server
HOST=127.0.0.1
PORT=5001

# The key that you actually put into JanitorAI. Can be anything.
PROXY_KEY=key_you_write_in_janitor
REQUIRE_PROXY_KEY=true
# Allow the key from Janitor to be used as the provider key.
ALLOW_KEY_PASSTHROUGH=false
# Default model to start on.
# If the specified model is not in the list sent by the provider, parameter correctness will not be verified.
MODEL=claude/claude-opus-4-6

# Generation parameters. The values below are the default values if not set directly.
# MAX_TOKENS, unlike other parameters, is overridden from Janitor.
MAX_TOKENS=128000
# Incompatible with thinking.
SEND_TEMPERATURE=false
TEMPERATURE=1
# Allowed range is 0.95 - 1 for thinking.
SEND_TOP_P=false
TOP_P=0.99
# Not part of the OpenAI schema, so Anthropic only. Unsupported for modern Claude models.
SEND_TOP_K=false
TOP_K=75
# Caching. Applies only to /v1/messages (Claude) as of now, the rest cache automatically.
CACHE_EN=true
# Cache system message.
CACHE_SYSTEM=true
CACHE_SYSTEM_TTL=1h
# Split system message into core definitions + lorebook, with an individual cache marker on each.
SPLIT_LOREBOOK=true
LOREBOOK_AT_END=false
LOREBOOK_XML_AT_END=false
# Manual cache marker placed CACHE_MANUAL_MSG from the start.
# 1 - first message of the chat (the intro). 0 to disable.
# Note that because LLMs expect user+assistant message pairs starting from user, chat agents (like Janitor) often send
# a fake user message at start (Janitor sends '.' as the first user message). This fake message is not counted.
CACHE_MANUAL_MSG=1
CACHE_MANUAL_TTL=1h
# Auto cache marker placed from CACHE_AUTO_MSG from the end.
# 1 - last user message. 0 to disable.
CACHE_AUTO_MSG=3
CACHE_AUTO_TTL=1h
# Anthropic auto-caching. Automatically caches the last message.
CACHE_ANTHROPIC_AUTO=false
CACHE_ANTHROPIC_TTL=1h

# Prefill
# none        - Disable prefill.
# assistant   - Append prefill as the last assistant message. Anthropic only, and not
#               compatible with thinking or Mythos (>=4.6) models.
# instruction - Append prefill as an OOC command at the end of last user message.
PREFILL_MODE=none
ASSISTANT_PREFILL=""

# Thinking.
THINKING_ENABLED=true
# Budget is used for older (<=4.5) Claude models. Modern ones prefer (or support only) effort.
THINKING_BUDGET=2048
# low, medium, high, xhigh, max
THINKING_EFFORT=high
# Anthropic only.
PRESERVE_THINKING_BLOCKS=0

# Behavior
AUTO_TRIM=true
# Enables replacing <summary_block_beg>/<summary_block_end> ranges with the summary text.
# When false, summary control messages are stripped but original conversation messages are kept.
SUMMARY_BLOCKS_ENABLED=true
DEBUG_LOG=true
ERROR_LOG_PATH=revpy_error.log
; #REQUEST_TIMEOUT_SECONDS=600
# Background /responses recovery. How long one whole turn may take, which is a different
# question from REQUEST_TIMEOUT_SECONDS above: a recovered turn is many HTTP calls, and
# the model reasons silently between them. While OpenAI still reports the job as running,
# this is the only thing that ends the turn -- raise it if long reasoning gets cut off.
#RESPONSES_TURN_TIMEOUT_SECONDS=1800
#RESPONSES_POLL_SECONDS=2
#MODEL_LIST_TIMEOUT_SECONDS=10

# Providers
# Every backend is a provider, declared under the wire protocol it speaks.
#   V1_MESSAGES_PROVIDERS         {BASE_URL}/messages          Anthropic (Claude)
#   V1_CHAT_COMPLETIONS_PROVIDERS {BASE_URL}/chat/completions  GLM, Kimi, Aion, most others
#   V1_RESPONSES_PROVIDERS        {BASE_URL}/responses         OpenAI
# Each NAME is configured through its own NAME_* variables. Their models all appear in one CLI 'model' list.
# Options available to every provider (NAME is the entry in one of the lists above):
#   NAME_BASE_URL                 required; the /v1 root, without a trailing slash
#   NAME_API_KEY                  provider key
#   NAME_MODELS                   comma-separated model ids; skips the /models request entirely
#   NAME_MODELS_REGEX             keeps only matching ids from the fetched /models list, for providers that also serve non-chat models
#   NAME_STORE                    let the provider retain the response (default false);
#                                 /responses only
#   NAME_BACKGROUND               run responses as background jobs so a cut stream is resumed
#                                 rather than lost (default false); /responses only
#   NAME_EXTRA_BODY               json5 object merged verbatim into every request, after the thinking dialect, so it can override anything the proxy sends
#   NAME_INPUT_TOKEN_COST_USD     provider-level prices, used by models matching no cost family.
#   NAME_OUTPUT_TOKEN_COST_USD
#   NAME_CACHE_READ_COST_USD
#   NAME_CACHE_WRITE_COST_USD
#   NAME_CACHE_WRITE_5M_COST_USD
#   NAME_CACHE_WRITE_1H_COST_USD
#   NAME_MODEL_<FAMILY>_REGEX     per-model prices; first match wins. Keys: input, output, cache_read, cache_write, cache_write_5m, cache_write_1h.
#   NAME_MODEL_<FAMILY>_COST

# /v1/messages providers
V1_MESSAGES_PROVIDERS=claude
CLAUDE_BASE_URL=https://api.anthropic.com/v1
CLAUDE_API_KEY=your_anthropic_api_key
CLAUDE_INPUT_TOKEN_COST_USD=10.00
CLAUDE_OUTPUT_TOKEN_COST_USD=50.00
CLAUDE_CACHE_READ_COST_USD=1.00
CLAUDE_CACHE_WRITE_5M_COST_USD=12.50
CLAUDE_CACHE_WRITE_1H_COST_USD=20.00
CLAUDE_MODEL_FABLE_REGEX=fable
CLAUDE_MODEL_FABLE_COST={input: 10.00, output: 50.00, cache_read: 1.00, cache_write_5m: 12.50, cache_write_1h: 20.00}
CLAUDE_MODEL_OPUS_REGEX=opus
CLAUDE_MODEL_OPUS_COST={input: 5.00, output: 25.00, cache_read: 0.50, cache_write_5m: 6.25, cache_write_1h: 10.00}
CLAUDE_MODEL_SONNET_REGEX=sonnet
CLAUDE_MODEL_SONNET_COST={input: 3.00, output: 15.00, cache_read: 0.30, cache_write_5m: 3.75, cache_write_1h: 6.00}
CLAUDE_MODEL_HAIKU_REGEX=haiku
CLAUDE_MODEL_HAIKU_COST={input: 1.00, output: 5.00, cache_read: 0.10, cache_write_5m: 1.25, cache_write_1h: 2.00}

# /v1/chat/completions providers (GLM, Kimi, Aion).
#V1_CHAT_COMPLETIONS_PROVIDERS=glm,kimi,aion
# GLM
GLM_BASE_URL=https://api.z.ai/api/paas/v4
GLM_API_KEY=your_glm_api_key
GLM_INPUT_TOKEN_COST_USD=0.60
GLM_OUTPUT_TOKEN_COST_USD=2.20
GLM_CACHE_READ_COST_USD=0.11
GLM_MODEL_GLM45AIR_REGEX=glm-4\.5-air$
GLM_MODEL_GLM45AIR_COST={input: 0.20, output: 1.10, cache_read: 0.03}
GLM_MODEL_GLM45_REGEX=glm-4\.5$
GLM_MODEL_GLM45_COST={input: 0.60, output: 2.20, cache_read: 0.11}
GLM_MODEL_GLM46_REGEX=glm-4\.6$
GLM_MODEL_GLM46_COST={input: 0.60, output: 2.20, cache_read: 0.11}
GLM_MODEL_GLM47_REGEX=glm-4\.7$
GLM_MODEL_GLM47_COST={input: 0.60, output: 2.20, cache_read: 0.11}
GLM_MODEL_GLM5_REGEX=glm-5$
GLM_MODEL_GLM5_COST={input: 1.00, output: 3.20, cache_read: 0.20}
GLM_MODEL_GLM5TURBO_REGEX=glm-5-turbo$
GLM_MODEL_GLM5TURBO_COST={input: 1.20, output: 4.00, cache_read: 0.24}
GLM_MODEL_GLM51_REGEX=glm-5\.1$
GLM_MODEL_GLM51_COST={input: 1.40, output: 4.40, cache_read: 0.26}
GLM_MODEL_GLM52_REGEX=glm-5\.2$
GLM_MODEL_GLM52_COST={input: 1.40, output: 4.40, cache_read: 0.26}
# Kimi
KIMI_BASE_URL=https://api.moonshot.ai/v1
KIMI_API_KEY=your_kimi_api_key
KIMI_INPUT_TOKEN_COST_USD=3.00
KIMI_OUTPUT_TOKEN_COST_USD=15.00
KIMI_CACHE_READ_COST_USD=0.30
KIMI_MODEL_K3_REGEX=^kimi-k3
KIMI_MODEL_K3_COST={input: 3.00, output: 15.00, cache_read: 0.30}
KIMI_MODEL_K27CODE_REGEX=^kimi-k2\.7-code
KIMI_MODEL_K27CODE_COST={input: 0.95, output: 4.00, cache_read: 0.19}
KIMI_MODEL_K26_REGEX=^kimi-k2\.6
KIMI_MODEL_K26_COST={input: 0.95, output: 4.00, cache_read: 0.16}
# Aion
AION_BASE_URL=https://api.aionlabs.ai/v1
AION_API_KEY=your_aion_api_key
AION_EXTRA_BODY={}
AION_MODEL_AION20_REGEX=aion-2\.0$
AION_MODEL_AION20_COST={input: 0.80, output: 1.60, cache_read: 0.20}
AION_MODEL_AION25_REGEX=aion-2\.5$
AION_MODEL_AION25_COST={input: 1.00, output: 3.00, cache_read: 0.35}
AION_MODEL_AION30_REGEX=aion-3\.0$
AION_MODEL_AION30_COST={input: 3.00, output: 6.00, cache_read: 0.75}
AION_MODEL_AION30MINI_REGEX=aion-3\.0-mini$
AION_MODEL_AION30MINI_COST={input: 0.70, output: 1.40, cache_read: 0.18}
AION_MODEL_AIONRP_REGEX=aion-rp-
AION_MODEL_AIONRP_COST={input: 0.80, output: 1.60}

# /v1/responses providers (The new OpenAI API)
#V1_RESPONSES_PROVIDERS=gpt
GPT_BASE_URL=https://api.openai.com/v1
GPT_API_KEY=your_openai_api_key
# none|auto|concise|detailed
GPT_REASONING_SUMMARY=detailed
# OpenAI keeps your chats on OpenAI's servers for 30 days unless this stays false.
# Note you will not see your chats in the API console if you set this to false.
GPT_STORE=false
GPT_BACKGROUND=true
# /models also lists tts, image, embedding, realtime and search models. Keep the text chat models only.
GPT_MODELS_REGEX=^(?:gpt-[45]|o[1-9]|chat-latest)(?!.*(?:audio|image|realtime|transcribe|tts|search|moderation|instruct|codex))
# Verbosity (low|medium|high) is an OpenAI-only knob with no shared setting.
#GPT_EXTRA_BODY={verbosity: "medium"}
GPT_INPUT_TOKEN_COST_USD=5.00
GPT_OUTPUT_TOKEN_COST_USD=30.00
GPT_CACHE_READ_COST_USD=0.50
GPT_CACHE_WRITE_COST_USD=6.25
GPT_MODEL_GPT56SOL_REGEX=^gpt-5\.6(-sol)?$
GPT_MODEL_GPT56SOL_COST={input: 5.00, output: 30.00, cache_read: 0.50, cache_write: 6.25}
GPT_MODEL_GPT56TERRA_REGEX=^gpt-5\.6-terra$
GPT_MODEL_GPT56TERRA_COST={input: 2.50, output: 15.00, cache_read: 0.25, cache_write: 3.125}
GPT_MODEL_GPT56LUNA_REGEX=^gpt-5\.6-luna$
GPT_MODEL_GPT56LUNA_COST={input: 1.00, output: 6.00, cache_read: 0.10, cache_write: 1.25}
GPT_MODEL_GPT55_REGEX=^gpt-5\.5
GPT_MODEL_GPT55_COST={input: 5.00, output: 30.00, cache_read: 0.50}
GPT_MODEL_GPT54MINI_REGEX=^gpt-5\.4-mini
GPT_MODEL_GPT54MINI_COST={input: 0.75, output: 4.50, cache_read: 0.075}
GPT_MODEL_GPT54NANO_REGEX=^gpt-5\.4-nano
GPT_MODEL_GPT54NANO_COST={input: 0.20, output: 1.25, cache_read: 0.02}
GPT_MODEL_GPT54_REGEX=^gpt-5\.4(?!-mini|-nano)
GPT_MODEL_GPT54_COST={input: 2.50, output: 15.00, cache_read: 0.25}
